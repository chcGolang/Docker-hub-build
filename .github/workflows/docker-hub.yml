name: Build and push Docker Hub

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          projects=$(find . -name Dockerfile -printf '%h\n' | sed 's|^\./||' | sort | jq -c -R -s 'split("\n") | map(select(length > 0))')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          chmod +x "${{ matrix.project }}/version.sh"
          echo "version=$("${{ matrix.project }}/version.sh")" >> "$GITHUB_OUTPUT"

      - name: Skip if version already published
        id: skip
        env:
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.project }}
        run: |
          v="${{ steps.version.outputs.version }}"
          if curl -fsSL "https://hub.docker.com/v2/repositories/${REPO}/tags?page_size=100" \
              | jq --arg v "$v" -e '[.results[].name] | index($v)' >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.project }}
          file: ./${{ matrix.project }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.project }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.project }}:${{ steps.version.outputs.version }}
          build-args: |
            OPENCODE_VERSION=${{ steps.version.outputs.version }}
